[project]
name = "memlab"
version = "0.1.0"
description = "A controlled test of what AI assistants write into memory, and whether it helps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
memlab = "memlab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
